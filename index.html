<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👽도파민 중독자👽</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBKCYxBf3SYgULC3WXtYxArWK3LamNiY",
      authDomain: "dopamine-maker.firebaseapp.com",
      databaseURL: "https://dopamine-maker-default-rtdb.firebaseio.com/",
      projectId: "dopamine-maker",
      storageBucket: "dopamine-maker.firebasestorage.app",
      messagingSenderId: "462116626407",
      appId: "1:462116626407:web:4739863a4c6c3a827e6742"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.fDb = db;
    window.fRef = ref;
    window.fSet = set;
    window.fGet = get;
    window.fOnValue = onValue;
    window.fPush = push;

    window.dispatchEvent(new Event('firebase-initialized'));
  </script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Orbit&display=swap');

    * { box-sizing: border-box; font-family: "Pretendard", sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body { text-align: center; background: #f1f4f9; margin: 0; padding: 24px 16px; color: #2d3436; display: flex; justify-content: center; min-height: 100vh; }
    h2 { font-size: 22px; font-weight: 700; color: #1e293b; margin-bottom: 24px; letter-spacing: -0.5px; }
    
    .screen { display: none; width: 100%; max-width: 420px; margin: 0 auto; }
    .screen.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

    .main-img { width: 240px; height: 240px; border-radius: 28px; object-fit: cover; cursor: pointer; box-shadow: 0 16px 32px rgba(108, 92, 231, 0.15); transition: all 0.3s ease; border: 4px solid #ffffff; }
    .main-img:hover { transform: translateY(-4px) scale(1.02); box-shadow: 0 20px 40px rgba(108, 92, 231, 0.25); }

    .btn { padding: 14px 20px; font-size: 15px; font-weight: 600; margin: 6px; cursor: pointer; background: white; color: #1e293b; border: none; border-radius: 16px; box-shadow: 0 4px 14px rgba(0,0,0,0.04); transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:active { transform: scale(0.96); }
    .btn:hover { filter: brightness(0.98); }

    .btn-add { background: linear-gradient(135deg, #6c5ce7, #8e44ad) !important; color: white !important; margin-top: 16px; width: 100%; border-radius: 16px; padding: 15px; font-size: 16px; box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3) !important; }

    .list-box { background: white; padding: 20px; border-radius: 20px; text-align: left; box-shadow: 0 10px 25px rgba(0,0,0,0.03); border: 1px solid rgba(226, 232, 240, 0.8); }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 4px; border-bottom: 1px solid #f1f5f9; font-size: 15px; }
    .list-item:last-child { border-bottom: none; }

    .btn-small { background: #f1f5f9 !important; color: #475569 !important; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: 0.2s; }
    .btn-small:hover { background: #e2e8f0 !important; color: #0f172a !important; }
    
    .trip-btn { display: block; width: 100%; margin: 10px 0; background: white; color: #1e293b; border: 1px solid #e2e8f0; font-size: 16px; font-weight: 700; padding: 16px; border-radius: 18px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); text-align: left; transition: 0.2s ease; }
    .trip-btn:hover { border-color: #6c5ce7; background: #fbfbfe; transform: translateY(-2px); }

    #new-trip-name, #new-trip-date, #theme { width: 100%; padding: 14px; margin-top: 8px; font-size: 14px; border: 1px solid #e2e8f0; border-radius: 14px; background: #f8fafc; outline: none; transition: 0.2s; }
    #new-trip-name:focus, #new-trip-date:focus, #theme:focus { border-color: #6c5ce7; background: white; box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15); }

    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 100; overflow-y: auto; }
    .modal-content { position: relative; margin: 40px auto; background: white; padding: 24px 20px; border-radius: 24px; width: 92%; max-width: 420px; text-align: center; box-shadow: 0 20px 40px rgba(0,0,0,0.15); animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); transition: all 0.4s ease; }
    @keyframes modalUp { from { transform: translateY(20px) scale(0.96); opacity: 0; } to { transform: translateY(0) scale(1); opacity: 1; } }

    .modal-content.dark-cinema { background: #09090b !important; color: #f8fafc !important; border: 2px solid #ff007f !important; box-shadow: 0 0 50px rgba(255, 0, 127, 0.5) !important; }
    .modal-content.dark-cinema h3 { color: #00ffcc !important; }
    .modal-content.dark-cinema input { background: #18181b !important; color: #00ffcc !important; border-color: #3f3f46 !important; }

    /* 게임 모드 탭 버튼 스타일 */
    .mode-tabs { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 10px; font-size: 14px; font-weight: 700; border: 1px solid #cbd5e1; background: #f1f5f9; color: #64748b; border-radius: 12px; cursor: pointer; transition: 0.2s; }
    .tab-btn.active { background: #6c5ce7; color: white; border-color: #6c5ce7; box-shadow: 0 4px 12px rgba(108, 92, 231, 0.3); }

    /* 룰렛용 & 사다리타기용 입력 영역 컨테이너 전환 */
    .section-area { display: none; text-align: left; margin: 16px 0; max-height: 250px; overflow-y: auto; }
    .section-area.active { display: block; }

    .profiles-container { display: flex; flex-direction: column; gap: 12px; }
    .profile-group { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px; display: flex; align-items: flex-start; gap: 10px; }
    .modal-content.dark-cinema .profile-group { background: #18181b; border-color: #27272a; }
    
    .profile-info { display: flex; flex-direction: column; align-items: center; width: 52px; flex-shrink: 0; }
    .profile-info img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; border: 2px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.06); }
    .profile-info span { font-weight: 700; margin-top: 4px; font-size: 12px; color: #334155; }
    .modal-content.dark-cinema .profile-info span { color: #f8fafc; }

    .input-list { flex-grow: 1; display: flex; flex-direction: column; gap: 6px; }
    .input-row { display: flex; gap: 6px; align-items: center; }
    .input-row input { flex-grow: 1; padding: 8px 10px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; outline: none; }
    .modal-content.dark-cinema .input-row input { background: #27272a; color: #00ffcc; border-color: #3f3f46; }
    
    .btn-item-add { background: #e2e8f0; border: none; border-radius: 8px; padding: 4px 8px; font-size: 11px; font-weight: bold; cursor: pointer; color: #475569; margin-top: 4px; align-self: flex-start; }
    .btn-item-del { background: #ff7675; border: none; border-radius: 6px; color: white; width: 24px; height: 24px; font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }

    /* 사다리타기 전용 UI 스타일 */
    .ladder-setup-box { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 12px; }
    .ladder-setup-box h4 { margin: 0 0 8px 0; font-size: 13px; color: #475569; }
    .ladder-results-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    .ladder-results-grid input { width: 100%; padding: 10px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 8px; background: white; outline: none; }

    .participants-grid { display: flex; justify-content: space-between; gap: 6px; }
    .participant-chip { flex: 1; background: white; border: 2px solid #e2e8f0; border-radius: 10px; padding: 8px 4px; text-align: center; cursor: pointer; transition: 0.2s; }
    .participant-chip.selected { border-color: #6c5ce7; background: #f3f0ff; }
    .participant-chip img { width: 32px; height: 32px; border-radius: 50%; object-fit: cover; margin-bottom: 4px; }
    .participant-chip span { display: block; font-size: 11px; font-weight: 700; color: #334155; }

    #roulette-container { position: relative; width: 220px; height: 220px; margin: 16px auto; }
    canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.12); transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); }
    .pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; border-top: 22px solid #ff4757; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2)); }
    
    #ladder-animation-box { display: none; width: 100%; height: 160px; margin: 16px auto; background: #1e293b; border-radius: 16px; align-items: center; justify-content: center; }
    #ladder-anim-text { font-size: 20px; font-weight: 900; color: #00ffcc; font-family: 'Orbit', monospace; }

    #buff-banner { display: none; font-size: 13px; font-weight: 800; margin: 8px 0; padding: 8px 10px; border-radius: 10px; animation: bounceText 0.5s infinite alternate; }
    @keyframes bounceText { from { transform: scale(1); } to { transform: scale(1.03); } }

    #winner-display { display: none; margin-top: 20px; }
    #winner-display img { width: 140px; height: auto; max-height: 180px; border-radius: 18px; border: 4px solid #ff4757; object-fit: contain; animation: bounce 1s infinite; background: white; padding: 6px; box-shadow: 0 10px 25px rgba(255, 71, 87, 0.2); }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    #winner-text { font-size: 20px; font-weight: 800; color: #ff4757; margin-top: 12px; }
    
    .modal-btns { display: flex; justify-content: space-between; margin-top: 12px; gap: 8px; }
    .modal-btns .btn { flex: 1; margin: 0; font-size: 14px; padding: 12px; }
    
    #loading { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: 999; line-height: 100vh; font-size: 18px; font-weight: 700; color: #334155; }

    .log-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; text-align: left; }
    .log-date { font-size: 11px; color: #94a3b8; font-weight: 500; margin-bottom: 4px; }
    .log-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .log-result { font-size: 14px; color: #6c5ce7; font-weight: 700; }
  </style>
</head>
<body>
  <div id="loading">데이터를 불러오는 중입니다... 🚀</div>

  <div id="screen-main" class="screen active">
    <img src="https://i.ibb.co/b5KhfR8w/image.png" class="main-img" onclick="showScreen('screen-category')">
    <h2>👽도파민 중독자👽</h2>
  </div>

  <div id="screen-category" class="screen">
    <h2>어디로 갈까요?</h2>
    <button class="btn" style="background: #74b9ff !important; color: white !important;" onclick="showScreen('screen-travel-list')">🪂 여행</button>
    <button class="btn" style="background: #fab1a0 !important; color: white !important;" onclick="openDaily()">🎶 일상</button><br><br>
    <button class="btn" style="background: #a29bfe !important; color: white !important; width: calc(100% - 40px); max-width: 320px;" onclick="openLogModal()">📜 전체 룰렛 기록 (로그)</button><br><br>
    <button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-main')">뒤로가기</button>
  </div>

  <div id="screen-travel-list" class="screen">
    <h2>🛤️ 여행 목록</h2>
    <div id="trip-list-container" style="max-width: 400px; margin: 0 auto;"></div>
    <div class="list-box" style="margin-top:20px; text-align:center;">
      <input type="text" id="new-trip-name" placeholder="새 여행 이름 (예: 10월 제천여행)">
      <input type="text" id="new-trip-date" placeholder="여행 일정 (예: 10.03 ~ 10.05)">
      <button class="btn btn-add" onclick="addNewTrip()">+ 새 여행 만들기</button>
    </div>
    <br><button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-category')">목록으로</button>
  </div>

  <div id="screen-trip-detail" class="screen">
    <h2 id="trip-detail-title">🛸 여행 이름</h2>
    <div id="travel-results" class="list-box"></div>
    <button class="btn btn-add" onclick="openRoulette('여행')">+ 복불복 항목 추가</button><br><br>
    <button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-travel-list')">목록으로</button>
  </div>

  <div id="screen-daily" class="screen">
    <h2>☕ 일상 복불복</h2>
    <div id="daily-results" class="list-box"></div>
    <button class="btn btn-add" onclick="openRoulette('일상')">+ 복불복 항목 추가</button><br><br>
    <button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-category')">뒤로가기</button>
  </div>

  <!-- 복불복 실행 모달 -->
  <div id="modal-roulette" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modal-title">🎲 복불복 진행</h3>
      <input type="text" id="theme" placeholder="주제를 입력하세요 (예: 점심 메뉴)">
      
      <!-- 탭 선택 (룰렛 / 사다리타기) -->
      <div class="mode-tabs">
        <button id="tab-roulette" class="tab-btn active" onclick="switchMode('roulette')">🎲 룰렛</button>
        <button id="tab-ladder" class="tab-btn" onclick="switchMode('ladder')">🪜 사다리타기</button>
      </div>

      <div id="buff-banner"></div>

      <!-- 1. 룰렛 전용 입력 영역 -->
      <div id="area-roulette" class="section-area active">
        <div class="profiles-container" id="profiles-container"></div>
      </div>

      <!-- 2. 사다리타기 전용 입력 영역 (결과 4개 + 참가자 선택) -->
      <div id="area-ladder" class="section-area">
        <div class="ladder-setup-box">
          <h4>🎁 당첨 결과 4개 입력</h4>
          <div class="ladder-results-grid">
            <input type="text" class="ladder-res" placeholder="결과 1 (예: 꽝)">
            <input type="text" class="ladder-res" placeholder="결과 2 (예: 당첨)">
            <input type="text" class="ladder-res" placeholder="결과 3 (예: 벌칙)">
            <input type="text" class="ladder-res" placeholder="결과 4 (예: 면제)">
          </div>
        </div>

        <div class="ladder-setup-box">
          <h4>👥 사다리 탈 사람 선택 (복수 선택 가능)</h4>
          <div class="participants-grid" id="participants-grid">
            <!-- JS로 동적 생성 -->
          </div>
        </div>
      </div>

      <!-- 룰렛 판 -->
      <div id="roulette-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="220" height="220"></canvas>
      </div>

      <!-- 사다리타기 연출 박스 -->
      <div id="ladder-animation-box">
        <div id="ladder-anim-text">🪜 LADDER RUN...</div>
      </div>

      <div id="winner-display"><img id="winner-img" src=""><div id="winner-text"></div></div>
      
      <div class="modal-btns">
        <button class="btn" style="background: #ff7675 !important; color: white !important; width: 100%;" onclick="closeRoulette()">❌ 닫기</button>
        <button id="btn-spin" class="btn" style="background: #a29bfe !important; color: white !important; flex: 2; width: 100%;" onclick="startAction()">🚀 START!</button>
      </div>
    </div>
  </div>

  <div id="modal-detail" class="modal-overlay">
    <div class="modal-content">
      <h3>👀 모두의 의견</h3>
      <div id="detail-items-list" class="list-box" style="box-shadow:none; padding:10px; margin-top:15px; border:1px solid #ddd; max-height:250px; overflow-y:auto;"></div>
      <button class="btn" style="background: #ff7675 !important; color: white !important; width: 100%; margin-top: 20px;" onclick="closeDetail()">닫기</button>
    </div>
  </div>

  <div id="modal-logs" class="modal-overlay">
    <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
      <h3 style="color: #6c5ce7; margin-top: 0;">📜 전체 룰렛 기록</h3>
      <div id="logs-container"><div style="color:#888; padding:20px;">기록을 불러오는 중...</div></div>
      <button class="btn" style="background: #ff7675 !important; color: white !important; width: 100%; margin-top: 15px;" onclick="closeLogModal()">닫기</button>
    </div>
  </div>

  <div id="modal-alert" class="modal-overlay">
    <div class="modal-content" style="max-width: 320px; padding: 25px;">
      <h3 style="margin-top: 0; color: #ff7675;">확인 🚨</h3>
      <p id="alert-msg" style="font-size: 16px; margin: 20px 0; color: #333;"></p>
      <button class="btn" style="background: #55efc4 !important; color: #2d3436 !important; width: 100%; margin-top: 10px;" onclick="closeCustomAlert()">확인</button>
    </div>
  </div>

  <script>
    let appData = { trips: {}, daily: {}, logs: {} };
    let currentCategory = '';
    let currentTripName = '';
    let currentMode = 'roulette'; // 'roulette' 또는 'ladder'

    const names = ['밍밍', '세세', '퍙퍙', '가가'];
    const avatars = [
      'https://i.ibb.co/8LPZjGPS/image.png',
      'https://i.ibb.co/pvwHBGWf/image.png',
      'https://i.ibb.co/XZ2X0Lyq/image.png',
      'https://i.ibb.co/nVW3JVQ/image.png'
    ];
    const colors = ['#ff7675', '#55efc4', '#74b9ff', '#ffeaa7'];
    let personWeights = [1, 1, 1, 1];
    let selectedParticipants = [true, true, true, true]; // 기본 전원 선택

    window.addEventListener('firebase-initialized', () => {
      const loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'block';
      const dataRef = window.fRef(window.fDb, 'travelApp');

      window.fOnValue(dataRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
          appData = { trips: val.trips || {}, daily: val.daily || [], logs: val.logs || {} };
        } else {
          appData = { trips: {}, daily: [], logs: {} };
        }
        renderTripList();
        if (currentCategory === '여행' && currentTripName && appData.trips[currentTripName]) {
          openTripDetail(currentTripName);
        } else if (currentCategory === '일상') {
          openDaily();
        }
        loadingEl.style.display = 'none';
      }, (error) => {
        loadingEl.style.display = 'none';
        showAlert("실시간 동기화 오류: " + error.message);
      });
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function renderTripList() {
      const container = document.getElementById('trip-list-container');
      container.innerHTML = '';
      const tripNames = Object.keys(appData.trips || {});
      if(tripNames.length === 0) {
        container.innerHTML = '<div class="list-box" style="color:#888; text-align:center;">아직 추가된 여행이 없습니다.</div>';
      } else {
        tripNames.forEach(name => {
          const btn = document.createElement('button');
          btn.className = 'btn trip-btn';
          btn.innerText = `🛤 ${name}`;
          btn.onclick = () => openTripDetail(name);
          container.appendChild(btn);
        });
      }
    }

    function addNewTrip() {
      const name = document.getElementById('new-trip-name').value.trim();
      const date = document.getElementById('new-trip-date').value.trim();
      if(!name || !date) { showAlert("여행 이름과 일정을 모두 입력해주세요!"); return; }
      
      if(!appData.trips) appData.trips = {};
      if(!appData.trips[name]) {
         appData.trips[name] = { date: date, items: [] };
         const tripRef = window.fRef(window.fDb, `travelApp/trips/${name}`);
         window.fSet(tripRef, { date: date, items: [] });
      }
      document.getElementById('new-trip-name').value = '';
      document.getElementById('new-trip-date').value = '';
      openTripDetail(name); 
    }

    function openDetail(itemObj) {
      const container = document.getElementById('detail-items-list');
      container.innerHTML = '';
      const resultStr = itemObj.result || "";

      if (itemObj.ladderResults) {
        // 사다리타기 상세 기록 출력
        container.innerHTML += `<div class="list-item" style="background:#f8fafc; font-weight:bold; justify-content:center;">🪜 사다리타기 결과</div>`;
        const results = itemObj.ladderResults;
        results.forEach((res, idx) => {
          container.innerHTML += `<div class="list-item"><strong>결과 ${idx+1} :</strong> <span>${res}</span></div>`;
        });
      } else if (itemObj.allEntries) {
        const allEntries = itemObj.allEntries;
        names.forEach((name, i) => {
          const userItems = allEntries[i] || [];
          if (userItems.length > 0) {
            const formattedItems = userItems.map(val => resultStr.includes(val) ? `${val} 🎉` : val).join(', ');
            container.innerHTML += `<div class="list-item"><strong>${name} :</strong> <span>${formattedItems}</span></div>`;
          } else {
            container.innerHTML += `<div class="list-item"><strong>${name} :</strong> <span>-</span></div>`;
          }
        });
      } else if (itemObj.opts) {
        const opts = itemObj.opts;
        names.forEach((name, i) => {
          const val = opts[i] || '-';
          const formattedVal = (val !== '-' && resultStr.includes(val)) ? `${val} 🎉` : val;
          container.innerHTML += `<div class="list-item"><strong>${name} :</strong> <span>${formattedVal}</span></div>`;
        });
      } else {
        container.innerHTML = '<div style="color:#888; text-align:center; padding:10px;">저장된 의견이 없습니다.</div>';
      }

      document.getElementById('modal-detail').style.display = 'block';
    }
    function closeDetail() { document.getElementById('modal-detail').style.display = 'none'; }

    function openLogModal() {
      const container = document.getElementById('logs-container');
      container.innerHTML = '';
      const logsObj = appData.logs || {};
      const logKeys = Object.keys(logsObj).reverse();

      if (logKeys.length === 0) {
        container.innerHTML = '<div style="color:#888; padding:20px;">아직 저장된 룰렛 기록이 없습니다.</div>';
      } else {
        logKeys.forEach(k => {
          const log = logsObj[k];
          container.innerHTML += `
            <div class="log-card">
              <div class="log-date">🕒 ${log.timestamp || ''} · [${log.category}${log.tripName ? ` - ${log.tripName}` : ''}]</div>
              <div class="log-title">📌 ${log.theme}</div>
              <div class="log-result">당첨: ${log.winnerName} (${log.result})</div>
            </div>
          `;
        });
      }
      document.getElementById('modal-logs').style.display = 'block';
    }
    function closeLogModal() { document.getElementById('modal-logs').style.display = 'none'; }

    function openTripDetail(tripName) {
      currentCategory = '여행';
      currentTripName = tripName;
      document.getElementById('trip-detail-title').innerText = `🚀 ${tripName}`;
      const container = document.getElementById('travel-results');
      container.innerHTML = '';
      
      const trip = appData.trips ? appData.trips[tripName] : null;
      if (!trip) return;

      if(trip.date) {
        container.innerHTML += `<div class="list-item" style="background:#f1fdf5; border: 2px solid #55efc4; border-radius: 8px; margin-bottom:15px; justify-content:center;"><strong>📅 날짜 : </strong> ${trip.date}</div>`;
      }
      
      const items = trip.items || [];
      if(items.length === 0) {
        container.innerHTML += '<div class="list-item" style="color:#888; text-align:center; display:block;">항목추가 버튼을 눌러 복불복을 시작하세요!</div>';
      } else {
        items.forEach(item => {
          const safeItem = encodeURIComponent(JSON.stringify(item));
          container.innerHTML += `
            <div class="list-item">
              <div style="flex-grow:1; text-align:left;"><strong>[${item.theme}]</strong> ${item.result}</div>
              <button class="btn-small" onclick='openDetail(JSON.parse(decodeURIComponent("${safeItem}")))'>🔍 보기</button>
            </div>
          `;
        });
      }
      showScreen('screen-trip-detail');
    }

    function openDaily() {
      currentCategory = '일상';
      currentTripName = '';
      const container = document.getElementById('daily-results');
      container.innerHTML = '';
      
      const dailyItems = appData.daily || [];
      if(dailyItems.length === 0) {
        container.innerHTML += '<div class="list-item" style="color:#888; text-align:center; display:block;">항목추가 버튼을 눌러 복불복을 시작하세요!</div>';
      } else {
        dailyItems.forEach(item => {
          const safeItem = encodeURIComponent(JSON.stringify(item));
          container.innerHTML += `
            <div class="list-item">
              <div style="flex-grow:1; text-align:left;"><strong>[${item.theme}]</strong> ${item.result}</div>
              <button class="btn-small" onclick='openDetail(JSON.parse(decodeURIComponent("${safeItem}")))'>🔍 보기</button>
            </div>
          `;
        });
      }
      showScreen('screen-daily');
    }

    function openRoulette(category) {
      currentCategory = category;
      document.getElementById('modal-title').innerText = category === '여행' ? `🎲 ${currentTripName} 복불복` : `🎲 일상 복불복`;
      document.getElementById('modal-roulette').style.display = 'block';
      document.getElementById('winner-display').style.display = 'none';
      document.getElementById('buff-banner').style.display = 'none';
      document.querySelector('.modal-content').classList.remove('dark-cinema');

      const spinBtn = document.getElementById('btn-spin');
      if (spinBtn) {
        spinBtn.disabled = false;
        spinBtn.style.display = 'inline-flex';
        spinBtn.innerText = "🚀 START!";
      }

      switchMode('roulette');
      personWeights = [1, 1, 1, 1];
      selectedParticipants = [true, true, true, true];
      document.getElementById('theme').value = '';
      renderProfileInputs();
      renderLadderParticipants();
    }

    // 모드 전환 (룰렛 <-> 사다리타기)
    function switchMode(mode) {
      currentMode = mode;
      const rTab = document.getElementById('tab-roulette');
      const lTab = document.getElementById('tab-ladder');
      const rArea = document.getElementById('area-roulette');
      const lArea = document.getElementById('area-ladder');
      const rContainer = document.getElementById('roulette-container');
      const lAnimBox = document.getElementById('ladder-animation-box');

      if (mode === 'roulette') {
        rTab.classList.add('active'); lTab.classList.remove('active');
        rArea.classList.add('active'); lArea.classList.remove('active');
        rContainer.style.display = 'block'; lAnimBox.style.display = 'none';
        drawWheel();
      } else {
        lTab.classList.add('active'); rTab.classList.remove('active');
        lArea.classList.add('active'); rArea.classList.remove('active');
        rContainer.style.display = 'none'; lAnimBox.style.display = 'none';
      }
    }

    function renderProfileInputs() {
      const container = document.getElementById('profiles-container');
      container.innerHTML = '';

      names.forEach((name, i) => {
        container.innerHTML += `
          <div class="profile-group">
            <div class="profile-info">
              <img src="${avatars[i]}">
              <span>${name}</span>
            </div>
            <div class="input-list" id="input-list-${i}">
              <div class="input-row">
                <input type="text" class="p-input-${i}" placeholder="항목 입력" oninput="drawWheel()">
              </div>
              <button class="btn-item-add" onclick="addInputRow(${i})">+ 항목추가</button>
            </div>
          </div>
        `;
      });
    }

    // 사다리 탈 사람 선택 그리드 렌더링
    function renderLadderParticipants() {
      const grid = document.getElementById('participants-grid');
      grid.innerHTML = '';
      names.forEach((name, i) => {
        const isSel = selectedParticipants[i];
        grid.innerHTML += `
          <div class="participant-chip ${isSel ? 'selected' : ''}" onclick="toggleParticipant(${i})">
            <img src="${avatars[i]}">
            <span>${name}</span>
          </div>
        `;
      });
    }

    function toggleParticipant(idx) {
      selectedParticipants[idx] = !selectedParticipants[idx];
      renderLadderParticipants();
    }

    function addInputRow(personIdx) {
      const listEl = document.getElementById(`input-list-${personIdx}`);
      const addBtn = listEl.querySelector('.btn-item-add');
      
      const newRow = document.createElement('div');
      newRow.className = 'input-row';
      newRow.innerHTML = `
        <input type="text" class="p-input-${personIdx}" placeholder="항목 입력" oninput="drawWheel()">
        <button class="btn-item-del" onclick="removeInputRow(this)">×</button>
      `;
      listEl.insertBefore(newRow, addBtn);
      drawWheel();
    }

    function removeInputRow(btn) {
      btn.parentElement.remove();
      drawWheel();
    }

    function closeRoulette() { document.getElementById('modal-roulette').style.display = 'none'; }

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    let currentRotation = 0;
    let isSpinning = false;

    function getAllFlatItems() {
      let flatList = [];
      names.forEach((name, i) => {
        const inputEls = document.querySelectorAll(`.p-input-${i}`);
        inputEls.forEach(el => {
          const val = el.value.trim();
          if (val !== '') {
            flatList.push({ personIdx: i, personName: name, text: val, weight: personWeights[i] });
          }
        });
      });
      return flatList;
    }

    function drawWheel() {
      const items = getAllFlatItems();
      ctx.clearRect(0, 0, 220, 220);

      if (items.length === 0) {
        ctx.beginPath(); ctx.fillStyle = '#e2e8f0'; ctx.arc(110, 110, 110, 0, Math.PI * 2); ctx.fill();
        ctx.save(); ctx.translate(110, 110);
        ctx.textAlign = "center"; ctx.fillStyle = "#64748b"; ctx.font = "bold 13px sans-serif";
        ctx.fillText("항목을 입력해주세요!", 0, 5); ctx.restore();
        return;
      }

      const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
      let currentAngle = 0;

      items.forEach((item) => {
        const sliceAngle = (item.weight / totalWeight) * (Math.PI * 2);
        const endAngle = currentAngle + sliceAngle;

        ctx.beginPath(); ctx.fillStyle = colors[item.personIdx % colors.length];
        ctx.moveTo(110, 110); ctx.arc(110, 110, 110, currentAngle, endAngle); ctx.fill();

        ctx.save(); ctx.translate(110, 110);
        ctx.rotate(currentAngle + sliceAngle / 2);
        ctx.textAlign = "right"; ctx.fillStyle = "#2d3436"; ctx.font = "bold 13px 'Orbit', monospace";
        ctx.fillText(item.text, 95, 5); ctx.restore();

        currentAngle = endAngle;
      });
    }

    function startAction() {
      if (isSpinning) return;
      const theme = document.getElementById('theme').value;
      if (!theme) { showAlert("주제를 입력해주세요!"); return; }

      if (currentMode === 'roulette') {
        let items = getAllFlatItems();
        if (items.length < 2) { showAlert("최소 2개 이상의 항목을 입력해주세요!"); return; }
        spinRoulette(theme, items);
      } else {
        // 사다리타기 유효성 검사
        const resInputs = document.querySelectorAll('.ladder-res');
        let ladderResults = [];
        resInputs.forEach(input => {
          if (input.value.trim() !== '') ladderResults.push(input.value.trim());
        });
        if (ladderResults.length < 2) { showAlert("최소 2개 이상의 결과를 입력해주세요!"); return; }

        const activeNames = names.filter((_, i) => selectedParticipants[i]);
        if (activeNames.length === 0) { showAlert("사다리를 탈 참가자를 최소 1명 이상 선택해주세요!"); return; }

        runLadder(theme, ladderResults, activeNames);
      }
    }

    function spinRoulette(theme, items) {
      isSpinning = true;
      const spinBtn = document.getElementById('btn-spin');
      if (spinBtn) spinBtn.disabled = true;

      const banner = document.getElementById('buff-banner');
      const modalContent = document.querySelector('.modal-content');

      personWeights = [1, 1, 1, 1];
      const eventChance = Math.random();
      const activePersons = Array.from(new Set(items.map(it => it.personIdx)));
      const chosenPersonIdx = activePersons[Math.floor(Math.random() * activePersons.length)];

      if (eventChance < 0.25) {
        personWeights[chosenPersonIdx] = 3.5;
        modalContent.classList.add('dark-cinema');
        banner.style.display = 'block'; banner.style.background = '#09090b'; banner.style.color = '#ff007f';
        banner.innerHTML = `😎 [${names[chosenPersonIdx]}] 욕심쟁이 등장! 칸이 괴물처럼 커졌다!`;
      } else if (eventChance < 0.5) {
        personWeights[chosenPersonIdx] = 0.25;
        modalContent.classList.remove('dark-cinema');
        banner.style.display = 'block'; banner.style.background = '#74b9ff'; banner.style.color = '#ffffff';
        banner.innerHTML = `👼 [${names[chosenPersonIdx]}] 천사 등장! 칸이 먼지처럼 작아졌다!`;
        confetti({ particleCount: 90, spread: 100, origin: { y: 0.5 }, colors: ['#ffffff', '#ffeaa7', '#74b9ff'] });
      } else {
        modalContent.classList.remove('dark-cinema');
        banner.style.display = 'none';
      }

      drawWheel();
      items = getAllFlatItems();

      const randomDegree = Math.floor(Math.random() * 360);
      const totalRotation = currentRotation + 3000 + randomDegree;
      currentRotation = totalRotation;
      canvas.style.transform = `rotate(${totalRotation}deg)`;
      
      setTimeout(() => {
        const totalWeight = items.reduce((sum, item) => sum + item.weight, 0);
        const pointerAngle = (360 - (totalRotation % 360) + 270) % 360; 
        const targetWeight = (pointerAngle / 360) * totalWeight;

        let accumulated = 0;
        let winner = items[0];
        for (let it of items) {
          accumulated += it.weight;
          if (targetWeight <= accumulated) { winner = it; break; }
        }

        finishRouletteGame(theme, winner, items);
      }, 3000);
    }

    function runLadder(theme, ladderResults, activeNames) {
      isSpinning = true;
      const spinBtn = document.getElementById('btn-spin');
      if (spinBtn) spinBtn.disabled = true;

      document.getElementById('area-ladder').style.display = 'none';
      const animBox = document.getElementById('ladder-animation-box');
      animBox.style.display = 'flex';
      
      const animText = document.getElementById('ladder-anim-text');
      let count = 0;
      const ladderInterval = setInterval(() => {
        animText.innerHTML = `🪜 사다리 타는 중${'.'.repeat((count % 3) + 1)}`;
        count++;
      }, 300);

      setTimeout(() => {
        clearInterval(ladderInterval);
        
        // 무작위로 참가자 한 명과 결과 한 개 매칭
        const chosenPersonName = activeNames[Math.floor(Math.random() * activeNames.length)];
        const chosenResult = ladderResults[Math.floor(Math.random() * ladderResults.length)];
        const personIdx = names.indexOf(chosenPersonName);

        const winnerObj = {
          personIdx: personIdx,
          personName: chosenPersonName,
          text: chosenResult
        };

        finishLadderGame(theme, winnerObj, ladderResults);
      }, 2000);
    }

    function finishRouletteGame(theme, winner, items) {
      const winnerName = winner.personName;
      const winnerAnswer = winner.text;

      let emoji = getThemeEmoji(theme);
      const resultString = `${winnerAnswer}`; 
      
      document.getElementById('roulette-container').style.display = 'none';
      document.getElementById('winner-display').style.display = 'block';
      document.getElementById('winner-img').src = avatars[winner.personIdx];
      document.getElementById('winner-text').innerHTML = `🎉 ${winnerName} 당첨!<br>${emoji} [${winnerAnswer}]`;
      
      const spinBtn = document.getElementById('btn-spin');
      if (spinBtn) spinBtn.style.display = 'none';

      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      
      const finalResult = `${emoji} ${resultString}`;
      
      let allEntriesObj = {};
      names.forEach((_, i) => {
        const els = document.querySelectorAll(`.p-input-${i}`);
        allEntriesObj[i] = Array.from(els).map(el => el.value.trim()).filter(v => v !== '');
      });

      const newItem = { theme: theme, result: finalResult, allEntries: allEntriesObj };
      saveGameData(theme, winnerName, finalResult, newItem);
    }

    function finishLadderGame(theme, winner, ladderResults) {
      const winnerName = winner.personName;
      const winnerAnswer = winner.text;

      let emoji = getThemeEmoji(theme);
      const resultString = `${winnerAnswer}`; 
      
      document.getElementById('ladder-animation-box').style.display = 'none';
      document.getElementById('winner-display').style.display = 'block';
      document.getElementById('winner-img').src = avatars[winner.personIdx];
      document.getElementById('winner-text').innerHTML = `🎉 ${winnerName} 당첨!<br>${emoji} [${winnerAnswer}]`;
      
      const spinBtn = document.getElementById('btn-spin');
      if (spinBtn) spinBtn.style.display = 'none';

      confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
      
      const finalResult = `${emoji} ${resultString}`;
      const newItem = { theme: theme, result: finalResult, ladderResults: ladderResults };
      saveGameData(theme, winnerName, finalResult, newItem);
    }

    function getThemeEmoji(theme) {
      let emoji = '🎯'; 
      const t = theme.toLowerCase();
      if (t.includes('총무') || t.includes('돈') || t.includes('비용') || t.includes('간식비') || t.includes('정산')) { emoji = '💰'; }
      else if (t.includes('숙소') || t.includes('호텔') || t.includes('방') || t.includes('잠') || t.includes('펜션')) { emoji = '🏠'; }
      else if (t.includes('메뉴') || t.includes('점심') || t.includes('저녁') || t.includes('밥') || t.includes('먹') || t.includes('식사') || t.includes('안주')) { emoji = '🍽️'; }
      else if (t.includes('카페') || t.includes('커피') || t.includes('음료') || t.includes('디저트')) { emoji = '☕'; }
      else if (t.includes('이동') || t.includes('차') || t.includes('운전') || t.includes('주차') || t.includes('택시')) { emoji = '🚗'; }
      else if (t.includes('지역') || t.includes('국가') || t.includes('장소') || t.includes('어디')) { emoji = '🚩'; }
      return emoji;
    }

    function saveGameData(theme, winnerName, finalResult, newItem) {
      const now = new Date();
      const timestampStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

      const logData = {
        timestamp: timestampStr,
        category: currentCategory,
        tripName: currentTripName || '',
        theme: theme,
        winnerName: winnerName,
        result: finalResult
      };
      const logListRef = window.fRef(window.fDb, 'travelApp/logs');
      const newLogRef = window.fPush(logListRef);
      window.fSet(newLogRef, logData);

      if (currentCategory === '여행') {
        if (!appData.trips[currentTripName].items) appData.trips[currentTripName].items = [];
        appData.trips[currentTripName].items.push(newItem);
        const tripItemsRef = window.fRef(window.fDb, `travelApp/trips/${currentTripName}/items`);
        window.fSet(tripItemsRef, appData.trips[currentTripName].items);
        openTripDetail(currentTripName);
      } else {
        if (!appData.daily) appData.daily = [];
        appData.daily.push(newItem);
        const dailyRef = window.fRef(window.fDb, `travelApp/daily`);
        window.fSet(dailyRef, appData.daily);
        openDaily();
      }

      isSpinning = false;
    }

    function showAlert(msg) {
      document.getElementById('alert-msg').innerText = msg;
      document.getElementById('modal-alert').style.display = 'block';
    }
    function closeCustomAlert() { document.getElementById('modal-alert').style.display = 'none'; }
  </script>
