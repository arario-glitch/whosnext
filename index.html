<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>👽도파민 중독자👽</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  
  <!-- Firebase SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, onValue, push } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBKCYxBf3SYgULC3WXtYxArWK3LamNiY",
      authDomain: "dopamine-maker.firebaseapp.com",
      databaseURL: "https://dopamine-maker-default-rtdb.firebaseio.com/",
      projectId: "dopamine-maker",
      storageBucket: "dopamine-maker.firebasestorage.app",
      messagingSenderId: "462116626407",
      appId: "1:462116626407:web:4739863a4c6c3a827e6742"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    window.fDb = db;
    window.fRef = ref;
    window.fSet = set;
    window.fGet = get;
    window.fOnValue = onValue;
    window.fPush = push;

    window.dispatchEvent(new Event('firebase-initialized'));
  </script>

  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
    @import url('https://fonts.googleapis.com/css2?family=Orbit&display=swap');

    * { 
      box-sizing: border-box; 
      font-family: "Pretendard", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    
    body { 
      text-align: center; 
      background: #f1f4f9; 
      margin: 0; 
      padding: 24px 16px; 
      color: #2d3436;
      display: flex;
      justify-content: center;
      min-height: 100vh;
    }

    h2 { 
      font-size: 22px; 
      font-weight: 700; 
      color: #1e293b; 
      margin-bottom: 24px; 
      letter-spacing: -0.5px;
    }
    
    .screen { 
      display: none; 
      width: 100%; 
      max-width: 420px; 
      margin: 0 auto; 
    }
    .screen.active { 
      display: block; 
      animation: fadeIn 0.4s cubic-bezier(0.16, 1, 0.3, 1); 
    }
    @keyframes fadeIn { 
      from { opacity: 0; transform: translateY(8px); } 
      to { opacity: 1; transform: translateY(0); } 
    }

    .main-img { 
      width: 240px; 
      height: 240px; 
      border-radius: 28px; 
      object-fit: cover; 
      cursor: pointer; 
      box-shadow: 0 16px 32px rgba(108, 92, 231, 0.15); 
      transition: all 0.3s ease;
      border: 4px solid #ffffff;
    }
    .main-img:hover { 
      transform: translateY(-4px) scale(1.02); 
      box-shadow: 0 20px 40px rgba(108, 92, 231, 0.25);
    }

    .btn { 
      padding: 14px 20px; 
      font-size: 15px; 
      font-weight: 600; 
      margin: 6px; 
      cursor: pointer; 
      background: white;
      color: #1e293b; 
      border: none; 
      border-radius: 16px; 
      box-shadow: 0 4px 14px rgba(0,0,0,0.04); 
      transition: all 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }
    .btn:active { transform: scale(0.96); }
    .btn:hover { filter: brightness(0.98); }

    .btn-add { 
      background: linear-gradient(135deg, #6c5ce7, #8e44ad) !important; 
      color: white !important; 
      margin-top: 16px; 
      width: 100%; 
      border-radius: 16px; 
      padding: 15px;
      font-size: 16px;
      box-shadow: 0 8px 20px rgba(108, 92, 231, 0.3) !important;
    }

    .list-box { 
      background: white; 
      padding: 20px; 
      border-radius: 20px; 
      text-align: left; 
      box-shadow: 0 10px 25px rgba(0,0,0,0.03); 
      border: 1px solid rgba(226, 232, 240, 0.8);
    }
    
    .list-item { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      padding: 12px 4px; 
      border-bottom: 1px solid #f1f5f9; 
      font-size: 15px; 
    }
    .list-item:last-child { border-bottom: none; }

    .btn-small { 
      background: #f1f5f9 !important; 
      color: #475569 !important; 
      border: none; 
      border-radius: 8px; 
      padding: 6px 12px; 
      font-size: 12px; 
      font-weight: 600;
      cursor: pointer; 
      white-space: nowrap; 
      transition: 0.2s;
    }
    .btn-small:hover { background: #e2e8f0 !important; color: #0f172a !important; }
    
    .trip-btn { 
      display: block; 
      width: 100%; 
      margin: 10px 0; 
      background: white; 
      color: #1e293b; 
      border: 1px solid #e2e8f0; 
      font-size: 16px; 
      font-weight: 700;
      padding: 16px;
      border-radius: 18px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      text-align: left;
      transition: 0.2s ease;
    }
    .trip-btn:hover { border-color: #6c5ce7; background: #fbfbfe; transform: translateY(-2px); }

    #new-trip-name, #new-trip-date, #theme { 
      width: 100%; padding: 14px; margin-top: 8px; font-size: 14px; 
      border: 1px solid #e2e8f0; border-radius: 14px; background: #f8fafc; outline: none; 
      transition: 0.2s;
    }
    #new-trip-name:focus, #new-trip-date:focus, #theme:focus { 
      border-color: #6c5ce7; background: white; box-shadow: 0 0 0 3px rgba(108, 92, 231, 0.15); 
    }

    .modal-overlay { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(15, 23, 42, 0.5); backdrop-filter: blur(4px); z-index: 100; overflow-y: auto;
    }
    .modal-content { 
      position: relative; margin: 60px auto; background: white; padding: 24px 20px; 
      border-radius: 24px; width: 90%; max-width: 380px; text-align: center; 
      box-shadow: 0 20px 40px rgba(0,0,0,0.15); animation: modalUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    @keyframes modalUp {
      from { transform: translateY(20px) scale(0.96); opacity: 0; }
      to { transform: translateY(0) scale(1); opacity: 1; }
    }

    .profiles { display: flex; justify-content: space-between; margin: 20px 0; gap: 8px; }
    .profile { display: flex; flex-direction: column; align-items: center; flex: 1; }
    .profile img { 
      width: 48px; height: 48px; border-radius: 50%; object-fit: cover; 
      border: 2px solid #e2e8f0; box-shadow: 0 4px 10px rgba(0,0,0,0.06);
    }
    .profile span { font-weight: 700; margin-top: 6px; font-size: 13px; color: #334155; }
    .profile input { 
      width: 100%; text-align: center; font-size: 13px; padding: 8px 4px; 
      margin-top: 6px; border: 1px solid #e2e8f0; border-radius: 10px; background: #f8fafc; outline: none;
    }
    .profile input:focus { border-color: #6c5ce7; background: white; }
    
    #roulette-container { position: relative; width: 240px; height: 240px; margin: 24px auto; }
    canvas { width: 100%; height: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.12); transition: transform 3s cubic-bezier(0.25, 0.1, 0.25, 1); }
    .pointer { 
      position: absolute; top: -14px; left: 50%; transform: translateX(-50%); 
      width: 0; height: 0; border-left: 12px solid transparent; border-right: 12px solid transparent; 
      border-top: 22px solid #ff4757; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.2));
    }
    
    #winner-display { display: none; margin-top: 20px; }
    #winner-display img { 
      width: 160px; height: auto; max-height: 200px; border-radius: 18px; 
      border: 4px solid #ff4757; object-fit: contain; animation: bounce 1s infinite; 
      background: white; padding: 6px; box-shadow: 0 10px 25px rgba(255, 71, 87, 0.2); 
    }
    @keyframes bounce { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
    #winner-text { font-size: 22px; font-weight: 800; color: #ff4757; margin-top: 14px; }
    
    .modal-btns { display: flex; justify-content: space-between; margin-top: 12px; gap: 8px; }
    .modal-btns .btn { flex: 1; margin: 0; font-size: 14px; padding: 12px; }
    
    #loading { 
      display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
      background: rgba(255,255,255,0.85); backdrop-filter: blur(8px); z-index: 999; 
      line-height: 100vh; font-size: 18px; font-weight: 700; color: #334155; 
    }

    .log-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 14px; padding: 14px; margin-bottom: 10px; text-align: left; }
    .log-date { font-size: 11px; color: #94a3b8; font-weight: 500; margin-bottom: 4px; }
    .log-title { font-size: 15px; font-weight: 700; color: #1e293b; margin-bottom: 4px; }
    .log-result { font-size: 14px; color: #6c5ce7; font-weight: 700; }
    .log-details { font-size: 12px; color: #64748b; margin-top: 8px; border-top: 1px dashed #cbd5e1; padding-top: 6px; }
  </style>
</head>
<body>
  <div id="loading">데이터를 불러오는 중입니다... 🚀</div>

  <!-- 1. 첫 화면 -->
  <div id="screen-main" class="screen active">
    <img src="https://i.ibb.co/b5KhfR8w/image.png" class="main-img" onclick="showScreen('screen-category')">
    <h2>👽도파민 중독자👽</h2>
  </div>

  <!-- 2. 카테고리 선택 -->
  <div id="screen-category" class="screen">
    <h2>어디로 갈까요?</h2>
    <button class="btn" style="background: #74b9ff !important; color: white !important;" onclick="showScreen('screen-travel-list')">🪂 여행</button>
    <button class="btn" style="background: #fab1a0 !important; color: white !important;" onclick="openDaily()">🎶 일상</button><br><br>
    <button class="btn" style="background: #a29bfe !important; color: white !important; width: calc(100% - 40px); max-width: 320px;" onclick="openLogModal()">📜 전체 룰렛 기록 (로그)</button><br><br>
    <button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-main')">뒤로가기</button>
  </div>

  <!-- 3. 여행 목록 -->
  <div id="screen-travel-list" class="screen">
    <h2>🛤️ 여행 목록</h2>
    <div id="trip-list-container" style="max-width: 400px; margin: 0 auto;"></div>
    <div class="list-box" style="margin-top:20px; text-align:center;">
      <input type="text" id="new-trip-name" placeholder="새 여행 이름 (예: 10월 제천여행)">
      <input type="text" id="new-trip-date" placeholder="여행 일정 (예: 10.03 ~ 10.05)">
      <button class="btn btn-add" onclick="addNewTrip()">+ 새 여행 만들기</button>
    </div>
    <br><button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-category')">목록으로</button>
  </div>

  <!-- 4. 여행 상세 -->
  <div id="screen-trip-detail" class="screen">
    <h2 id="trip-detail-title">🛸 여행 이름</h2>
    <div id="travel-results" class="list-box"></div>
    <button class="btn btn-add" onclick="openRoulette('여행')">+ 복불복 항목 추가</button><br><br>
    <button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-travel-list')">목록으로</button>
  </div>

  <!-- 5. 일상 상세 -->
  <div id="screen-daily" class="screen">
    <h2>☕ 일상 복불복</h2>
    <div id="daily-results" class="list-box"></div>
    <button class="btn btn-add" onclick="openRoulette('일상')">+ 복불복 항목 추가</button><br><br>
    <button class="btn" style="background: #dfe6e9 !important; color: #636e72 !important;" onclick="showScreen('screen-category')">뒤로가기</button>
  </div>

  <!-- 6. 룰렛 모달 -->
  <div id="modal-roulette" class="modal-overlay">
    <div class="modal-content">
      <h3 id="modal-title">🎲 룰렛 돌리기</h3>
      <input type="text" id="theme" placeholder="주제를 입력하세요 (예: 점심 메뉴)">
      <div class="profiles">
        <div class="profile"><img id="img-opt1" src="https://i.ibb.co/8LPZjGPS/image.png"><span>밍밍</span><input type="text" id="opt1" placeholder="입력"></div>
        <div class="profile"><img id="img-opt2" src="https://i.ibb.co/pvwHBGWf/image.png"><span>세세</span><input type="text" id="opt2" placeholder="입력"></div>
        <div class="profile"><img id="img-opt3" src="https://i.ibb.co/XZ2X0Lyq/image.png"><span>퍙퍙</span><input type="text" id="opt3" placeholder="입력"></div>
        <div class="profile"><img id="img-opt4" src="https://i.ibb.co/nVW3JVQ/image.png"><span>가가</span><input type="text" id="opt4" placeholder="입력"></div>
      </div>
      div id="roulette-container">
        <div class="pointer"></div>
        <canvas id="wheel" width="250" height="250"></canvas>
      </div>

      <!-- 🎰 [변신 포인트] 평소엔 숨어있다가 룰렛이 끝날 때 팡 하고 튀어나오는 슬롯머신 박스! -->
      <div id="slot-container" style="display:none; width: 240px; height: 100px; margin: 24px auto; background: #1e293b; border-radius: 20px; border: 4px solid #a29bfe; align-items: center; justify-content: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2);">
        <div id="slot-text" style="font-size: 24px; font-weight: 900; color: #55efc4; font-family: 'Orbit', monospace; letter-spacing: 2px;">🎰 DRUM SPIN...</div>
      </div>
      <div id="winner-display"><img id="winner-img" src=""><div id="winner-text"></div></div>
      <div class="modal-btns">
        <button class="btn" style="background: #ff7675 !important; color: white !important; width: 100%;" onclick="closeRoulette()">❌ 닫기</button>
        <button class="btn" style="background: #a29bfe !important; color: white !important; flex: 2; width: 100%;" onclick="spin()">🎲 룰렛 GO!</button>
      </div>
    </div>
  </div>

  <!-- 7. 의견 보기 모달 -->
  <div id="modal-detail" class="modal-overlay">
    <div class="modal-content">
      <h3>👀 모두의 의견</h3>
      <div class="list-box" style="box-shadow:none; padding:10px; margin-top:15px; border:1px solid #ddd;">
        <div class="list-item"><strong>밍밍 :</strong> <span id="detail-opt1"></span></div>
        <div class="list-item"><strong>세세 :</strong> <span id="detail-opt2"></span></div>
        <div class="list-item"><strong>퍙퍙 :</strong> <span id="detail-opt3"></span></div>
        <div class="list-item"><strong>가가 :</strong> <span id="detail-opt4"></span></div>
      </div>
      <button class="btn" style="background: #ff7675 !important; color: white !important; width: 100%; margin-top: 20px;" onclick="closeDetail()">닫기</button>
    </div>
  </div>

  <!-- 8. 로그 모달 -->
  <div id="modal-logs" class="modal-overlay">
    <div class="modal-content" style="max-height: 80vh; overflow-y: auto;">
      <h3 style="color: #6c5ce7; margin-top: 0;">📜 전체 룰렛 기록</h3>
      <div id="logs-container"><div style="color:#888; padding:20px;">기록을 불러오는 중...</div></div>
      <button class="btn" style="background: #ff7675 !important; color: white !important; width: 100%; margin-top: 15px;" onclick="closeLogModal()">닫기</button>
    </div>
  </div>

  <!-- 9. 경고 팝업 -->
  <div id="modal-alert" class="modal-overlay">
    <div class="modal-content" style="max-width: 320px; padding: 25px;">
      <h3 style="margin-top: 0; color: #ff7675;">확인 🚨</h3>
      <p id="alert-msg" style="font-size: 16px; margin: 20px 0; color: #333;"></p>
      <button class="btn" style="background: #55efc4 !important; color: #2d3436 !important; width: 100%; margin-top: 10px;" onclick="closeCustomAlert()">확인</button>
    </div>
  </div>

  <script>
    let appData = { trips: {}, daily: {}, logs: {} };
    let currentCategory = '';
    let currentTripName = '';

    window.addEventListener('firebase-initialized', () => {
      const loadingEl = document.getElementById('loading');
      loadingEl.style.display = 'block';
      const dataRef = window.fRef(window.fDb, 'travelApp');

      window.fOnValue(dataRef, (snapshot) => {
        const val = snapshot.val();
        if (val) {
          appData = {
            trips: val.trips || {},
            daily: val.daily || [],
            logs: val.logs || {}
          };
        } else {
          appData = { trips: {}, daily: [], logs: {} };
        }
        renderTripList();
        if (currentCategory === '여행' && currentTripName && appData.trips[currentTripName]) {
          openTripDetail(currentTripName);
        } else if (currentCategory === '일상') {
          openDaily();
        }
        loadingEl.style.display = 'none';
      }, (error) => {
        loadingEl.style.display = 'none';
        showAlert("실시간 동기화 오류: " + error.message);
      });
    });

    function showScreen(screenId) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.getElementById(screenId).classList.add('active');
    }

    function renderTripList() {
      const container = document.getElementById('trip-list-container');
      container.innerHTML = '';
      const tripNames = Object.keys(appData.trips || {});
      if(tripNames.length === 0) {
        container.innerHTML = '<div class="list-box" style="color:#888; text-align:center;">아직 추가된 여행이 없습니다.</div>';
      } else {
        tripNames.forEach(name => {
          const btn = document.createElement('button');
          btn.className = 'btn trip-btn';
          btn.innerText = `🛤 ${name}`;
          btn.onclick = () => openTripDetail(name);
          container.appendChild(btn);
        });
      }
    }

    function addNewTrip() {
      const name = document.getElementById('new-trip-name').value.trim();
      const date = document.getElementById('new-trip-date').value.trim();
      if(!name || !date) { showAlert("여행 이름과 일정을 모두 입력해주세요!"); return; }
      
      if(!appData.trips) appData.trips = {};
      if(!appData.trips[name]) {
         appData.trips[name] = { date: date, items: [] };
         const tripRef = window.fRef(window.fDb, `travelApp/trips/${name}`);
         window.fSet(tripRef, { date: date, items: [] });
      }
      document.getElementById('new-trip-name').value = '';
      document.getElementById('new-trip-date').value = '';
      openTripDetail(name); 
    }

    function openDetail(o1, o2, o3, o4, resultString) {
      let winnerAnswer = "";
      if (resultString) {
          const parts = resultString.trim().split(' ');
          winnerAnswer = parts.length > 1 ? parts.slice(1).join(' ') : parts[0];
      }
      document.getElementById('detail-opt1').innerHTML = o1 ? (o1 === winnerAnswer ? `${o1} 🎉` : o1) : '-';
      document.getElementById('detail-opt2').innerHTML = o2 ? (o2 === winnerAnswer ? `${o2} 🎉` : o2) : '-';
      document.getElementById('detail-opt3').innerHTML = o3 ? (o3 === winnerAnswer ? `${o3} 🎉` : o3) : '-';
      document.getElementById('detail-opt4').innerHTML = o4 ? (o4 === winnerAnswer ? `${o4} 🎉` : o4) : '-';
      document.getElementById('modal-detail').style.display = 'block';
    }
    function closeDetail() { document.getElementById('modal-detail').style.display = 'none'; }

    function openLogModal() {
      const container = document.getElementById('logs-container');
      container.innerHTML = '';
      const logsObj = appData.logs || {};
      const logKeys = Object.keys(logsObj).reverse();

      if (logKeys.length === 0) {
        container.innerHTML = '<div style="color:#888; padding:20px;">아직 저장된 룰렛 기록이 없습니다.</div>';
      } else {
        logKeys.forEach(k => {
          const log = logsObj[k];
          const div = document.createElement('div');
          div.className = 'log-card';
          div.innerHTML = `
            <div class="log-date">🕒 ${log.timestamp || ''} · [${log.category}${log.tripName ? ` - ${log.tripName}` : ''}]</div>
            <div class="log-title">📌 ${log.theme}</div>
            <div class="log-result">당첨: ${log.winnerName} (${log.result})</div>
            <div class="log-details">
              밍밍: ${log.opts?.[0] || '-'} | 세세: ${log.opts?.[1] || '-'} | 퍙퍙: ${log.opts?.[2] || '-'} | 가가: ${log.opts?.[3] || '-'}
            </div>
          `;
          container.appendChild(div);
        });
      }
      document.getElementById('modal-logs').style.display = 'block';
    }
    function closeLogModal() { document.getElementById('modal-logs').style.display = 'none'; }

    function openTripDetail(tripName) {
      currentCategory = '여행';
      currentTripName = tripName;
      document.getElementById('trip-detail-title').innerText = `🚀 ${tripName}`;
      const container = document.getElementById('travel-results');
      container.innerHTML = '';
      
      const trip = appData.trips ? appData.trips[tripName] : null;
      if (!trip) return;

      if(trip.date) {
        container.innerHTML += `<div class="list-item" style="background:#f1fdf5; border: 2px solid #55efc4; border-radius: 8px; margin-bottom:15px; justify-content:center;"><strong>📅 날짜 : </strong> ${trip.date}</div>`;
      }
      
      const items = trip.items || [];
      if(items.length === 0) {
        container.innerHTML += '<div class="list-item" style="color:#888; text-align:center; display:block;">항목추가 버튼을 눌러 복불복을 시작하세요!</div>';
      } else {
        items.forEach(item => {
          const opts = item.opts || ['?', '?', '?', '?'];
          const safeOpts = opts.map(o => (o||'').replace(/'/g, "\\'"));
          const safeResult = (item.result || '').replace(/'/g, "\\'");
          container.innerHTML += `
            <div class="list-item">
              <div style="flex-grow:1; text-align:left;"><strong>[${item.theme}]</strong> ${item.result}</div>
              <button class="btn-small" onclick="openDetail('${safeOpts[0]}', '${safeOpts[1]}', '${safeOpts[2]}', '${safeOpts[3]}', '${safeResult}')">🔍 보기</button>
            </div>
          `;
        });
      }
      showScreen('screen-trip-detail');
    }

    function openDaily() {
      currentCategory = '일상';
      currentTripName = '';
      const container = document.getElementById('daily-results');
      container.innerHTML = '';
      
      const dailyItems = appData.daily || [];
      if(dailyItems.length === 0) {
        container.innerHTML += '<div class="list-item" style="color:#888; text-align:center; display:block;">항목추가 버튼을 눌러 복불복을 시작하세요!</div>';
      } else {
        dailyItems.forEach(item => {
          const opts = item.opts || ['?', '?', '?', '?'];
          const safeOpts = opts.map(o => (o||'').replace(/'/g, "\\'"));
          const safeResult = (item.result || '').replace(/'/g, "\\'");
          container.innerHTML += `
            <div class="list-item">
              <div style="flex-grow:1; text-align:left;"><strong>[${item.theme}]</strong> ${item.result}</div>
              <button class="btn-small" onclick="openDetail('${safeOpts[0]}', '${safeOpts[1]}', '${safeOpts[2]}', '${safeOpts[3]}', '${safeResult}')">🔍 보기</button>
            </div>
          `;
        });
      }
      showScreen('screen-daily');
    }

    function openRoulette(category) {
      currentCategory = category;
      document.getElementById('modal-title').innerText = category === '여행' ? `🎲 ${currentTripName} 복불복` : `🎲 일상 복불복`;
      document.getElementById('modal-roulette').style.display = 'block';
      document.getElementById('roulette-container').style.display = 'block';
      document.getElementById('winner-display').style.display = 'none';

      clearRouletteInputs();
    }

    function clearRouletteInputs() {
      document.getElementById('theme').value = '';
      document.getElementById('opt1').value = '';
      document.getElementById('opt2').value = '';
      document.getElementById('opt3').value = '';
      document.getElementById('opt4').value = '';
      drawWheel();
    }
    
    function closeRoulette() { document.getElementById('modal-roulette').style.display = 'none'; }

    const canvas = document.getElementById('wheel');
    const ctx = canvas.getContext('2d');
    const colors = ['#ff7675', '#55efc4', '#74b9ff', '#ffeaa7'];
    const names = ['밍밍', '세세', '퍙퍙', '가가'];
    let currentRotation = 0;
    let isSpinning = false;

    function drawWheel() {
      const options = [
        document.getElementById('opt1').value || '?', document.getElementById('opt2').value || '?',
        document.getElementById('opt3').value || '?', document.getElementById('opt4').value || '?'
      ];
      const arc = Math.PI / 2;
      ctx.clearRect(0, 0, 250, 250);
      for(let i = 0; i < 4; i++) {
        ctx.beginPath();
        ctx.fillStyle = colors[i];
        ctx.moveTo(125, 125);
        ctx.arc(125, 125, 125, i * arc, (i + 1) * arc);
        ctx.fill();
        ctx.save();
        ctx.translate(125, 125);
        ctx.rotate(i * arc + arc / 2);
        ctx.textAlign = "right"; ctx.fillStyle = "#2d3436"; ctx.font = "bold 16px 'Orbit', monospace";
        ctx.fillText(options[i], 110, 6);
        ctx.restore();
      }
    }
    document.querySelectorAll('.profiles input').forEach(input => input.addEventListener('input', drawWheel));
    drawWheel();

    function spin() {
      if (isSpinning) return;
      const theme = document.getElementById('theme').value;
      const opts = [
        document.getElementById('opt1').value, document.getElementById('opt2').value,
        document.getElementById('opt3').value, document.getElementById('opt4').value
      ];
      
      if(!theme || opts.includes('')) { showAlert("주제와 4명의 의견을 모두 채워주세요!"); return; }

      isSpinning = true;

      // 초기화: 룰렛 보이게, 슬롯머신 숨기기
      document.getElementById('roulette-container').style.display = 'block';
      document.getElementById('slot-container').style.display = 'none';

      const randomDegree = Math.floor(Math.random() * 360);
      const totalRotation = currentRotation + 2500 + randomDegree;
      currentRotation = totalRotation;
      canvas.style.transform = `rotate(${totalRotation}deg)`;
      
      // ⏱️ [반전 타이밍] 룰렛이 끝나기 직전(2초 뒤), 갑자기 슬롯머신으로 변신!
      setTimeout(() => {
        document.getElementById('roulette-container').style.display = 'none';
        document.getElementById('slot-container').style.display = 'flex';
        
        const slotEl = document.getElementById('slot-text');
        let count = 0;
        const slotInterval = setInterval(() => {
          const randomName = names[Math.floor(Math.random() * names.length)];
          slotEl.innerHTML = `🎰 ${randomName}?!`;
          count++;
        }, 80);

        // 슬롯머신이 드르륵 하다가 최종 당첨자 확정! (1초 뒤)
        setTimeout(() => {
          clearInterval(slotInterval);

          const pointerAngle = (360 - (totalRotation % 360) + 270) % 360; 
          const winnerIndex = Math.floor(pointerAngle / 90);
          const winnerName = names[winnerIndex];
          const winnerAnswer = opts[winnerIndex];

          let emoji = '🎯'; 
          const t = theme.toLowerCase();
          if (t.includes('총무') || t.includes('돈') || t.includes('비용') || t.includes('간식비') || t.includes('정산')) { emoji = '💰'; }
          else if (t.includes('숙소') || t.includes('호텔') || t.includes('방') || t.includes('잠') || t.includes('펜션')) { emoji = '🏠'; }
          else if (t.includes('메뉴') || t.includes('점심') || t.includes('저녁') || t.includes('밥') || t.includes('먹') || t.includes('식사') || t.includes('안주')) { emoji = '🍽️️'; }
          else if (t.includes('카페') || t.includes('커피') || t.includes('음료') || t.includes('디저트')) { emoji = '☕'; }
          else if (t.includes('이동') || t.includes('차') || t.includes('운전') || t.includes('주차') || t.includes('택시')) { emoji = '🚗'; }
          else if (t.includes('지역') || t.includes('국가') || t.includes('장소') || t.includes('어디')) { emoji = '🚩'; }

          const resultString = `${winnerAnswer}`; 
          
          document.getElementById('slot-container').style.display = 'none';
          document.getElementById('winner-display').style.display = 'block';
          document.getElementById('winner-img').src = document.getElementById(`img-opt${winnerIndex + 1}`).src;
          document.getElementById('winner-text').innerHTML = `🎉 ${winnerName} 당첨!<br>${emoji} [${winnerAnswer}]`;
          
          confetti({ particleCount: 150, spread: 70, origin: { y: 0.6 } });
          
          const finalResult = `${emoji} ${resultString}`;
          const newItem = { theme: theme, result: finalResult, opts: opts };

          const now = new Date();
          const timestampStr = `${now.getFullYear()}.${String(now.getMonth() + 1).padStart(2, '0')}.${String(now.getDate()).padStart(2, '0')} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

          const logData = {
            timestamp: timestampStr,
            category: currentCategory,
            tripName: currentTripName || '',
            theme: theme,
            winnerName: winnerName,
            result: finalResult,
            opts: opts
          };
          const logListRef = window.fRef(window.fDb, 'travelApp/logs');
          const newLogRef = window.fPush(logListRef);
          window.fSet(newLogRef, logData);

          if (currentCategory === '여행') {
            if (!appData.trips[currentTripName].items) appData.trips[currentTripName].items = [];
            appData.trips[currentTripName].items.push(newItem);
            const tripItemsRef = window.fRef(window.fDb, `travelApp/trips/${currentTripName}/items`);
            window.fSet(tripItemsRef, appData.trips[currentTripName].items);
            openTripDetail(currentTripName);
          } else {
            if (!appData.daily) appData.daily = [];
            appData.daily.push(newItem);
            const dailyRef = window.fRef(window.fDb, `travelApp/daily`);
            window.fSet(dailyRef, appData.daily);
            openDaily();
          }

          isSpinning = false;
        }, 1000);

      }, 2000);
    }

    function showAlert(msg) {
      document.getElementById('alert-msg').innerText = msg;
      document.getElementById('modal-alert').style.display = 'block';
    }
    function closeCustomAlert() { document.getElementById('modal-alert').style.display = 'none'; }
  </script>
</body>
</html>
