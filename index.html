<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>log-in-days</title>
  
  <!-- 웹 폰트 로드: Pretendard, 나눔명조, 둥근모(픽셀체) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700&family=DungGeunMo&display=swap">

  <!-- Firebase v10 SDK 모듈 로드 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // 🔥 [설정 1] 본인의 파이어베이스 프로젝트 설정 정보 입력
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
      databaseURL: "https://YOUR_PROJECT_ID-default-rtdb.firebaseio.com",
      projectId: "YOUR_PROJECT_ID",
      storageBucket: "YOUR_PROJECT_ID.appspot.com",
      messagingSenderId: "YOUR_SENDER_ID",
      appId: "YOUR_APP_ID"
    };

    // 🔥 [설정 2] 본인의 구글 이메일 입력 (이 계정 외에는 로그인 시 자동 차단)
    const ALLOWED_EMAIL = "your-email@gmail.com";

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);
    const provider = new GoogleAuthProvider();

    window.fAuth = auth;
    window.fProvider = provider;
    window.fDb = db;
    window.fRef = ref;
    window.fSet = set;
    window.fPush = push;
    window.fOnValue = onValue;
    window.fRemove = remove;
    window.fSignIn = signInWithPopup;
    window.fSignOut = signOut;
    window.ALLOWED_EMAIL = ALLOWED_EMAIL;

    window.dispatchEvent(new Event('firebase-ready'));
  </script>

  <style>
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      -webkit-tap-highlight-color: transparent; 
    }
    
    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #121418;
      padding: 16px;
      font-family: 'Pretendard', sans-serif;
    }

    /* 📖 일기장 컨테이너 & 펼침 애니메이션 */
    .book-container {
      width: 100%;
      max-width: 480px;
      min-height: 85vh;
      border-radius: 28px;
      padding: 28px 24px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.45);
      position: relative;
      overflow: hidden;
      transform-origin: left center;
      animation: bookOpen 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      display: flex;
      flex-direction: column;
      transition: background 0.3s ease, border-color 0.3s ease, color 0.3s ease;
    }

    @keyframes bookOpen {
      0% { transform: scale(0.94) rotateY(-12deg); opacity: 0; }
      100% { transform: scale(1) rotateY(0deg); opacity: 1; }
    }

    /* ========================================================
       🎨 4가지 감성 템플릿
       ======================================================== */
    /* 1. 👑 로맨스 판타지 영애 테마 */
    .theme-royalty {
      background: #fbf8f1 !important;
      color: #3e2723 !important;
      border: 3px double #d4af37 !important;
      font-family: 'Nanum Myeongjo', serif !important;
    }
    .theme-royalty input, .theme-royalty textarea {
      background: #f4ecdc !important;
      border: 1px solid #d4af37 !important;
      color: #3e2723 !important;
      font-family: 'Nanum Myeongjo', serif !important;
    }
    .theme-royalty .accent-btn {
      background: linear-gradient(135deg, #b8860b, #d4af37) !important;
      color: #ffffff !important;
      box-shadow: 0 4px 14px rgba(184, 134, 11, 0.25) !important;
    }
    .theme-royalty .diary-card {
      background: rgba(212, 175, 55, 0.08) !important;
      border: 1px solid rgba(212, 175, 55, 0.3) !important;
    }

    /* 2. 👾 레트로 픽셀 게임 테마 */
    .theme-retro {
      background: #181926 !important;
      color: #89b4fa !important;
      border: 4px solid #f38ba8 !important;
      font-family: 'DungGeunMo', monospace !important;
      box-shadow: 0 0 24px rgba(243, 139, 168, 0.25) !important;
    }
    .theme-retro input, .theme-retro textarea {
      background: #11111b !important;
      border: 2px solid #a6e3a1 !important;
      color: #a6e3a1 !important;
      font-family: 'DungGeunMo', monospace !important;
    }
    .theme-retro .accent-btn {
      background: #fab387 !important;
      color: #11111b !important;
      border-radius: 6px !important;
      font-weight: bold;
    }
    .theme-retro .diary-card {
      background: #1e1e2e !important;
      border: 2px solid #cba6f7 !important;
    }

    /* 3. 🖤 올블랙 딥다크 테마 */
    .theme-dark {
      background: #0d0f12 !important;
      color: #e2e8f0 !important;
      border: 1px solid #1e293b !important;
      font-family: 'Pretendard', sans-serif !important;
    }
    .theme-dark input, .theme-dark textarea {
      background: #161b22 !important;
      border: 1px solid #30363d !important;
      color: #f0f6fc !important;
    }
    .theme-dark .accent-btn {
      background: #3b82f6 !important;
      color: #ffffff !important;
    }
    .theme-dark .diary-card {
      background: rgba(255, 255, 255, 0.04) !important;
      border: 1px solid rgba(255, 255, 255, 0.08) !important;
    }

    /* 4. 🤍 순백 페이퍼 테마 */
    .theme-white {
      background: #ffffff !important;
      color: #1e293b !important;
      border: 1px solid #e2e8f0 !important;
      font-family: 'Pretendard', sans-serif !important;
    }
    .theme-white input, .theme-white textarea {
      background: #f8fafc !important;
      border: 1px solid #cbd5e1 !important;
      color: #0f172a !important;
    }
    .theme-white .accent-btn {
      background: #0f172a !important;
      color: #ffffff !important;
    }
    .theme-white .diary-card {
      background: #f8fafc !important;
      border: 1px solid #e2e8f0 !important;
    }

    /* 공통 컴포넌트 */
    .top-bar { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 20px; 
    }
    .app-brand {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .theme-selector { 
      display: flex; 
      gap: 7px; 
      align-items: center;
    }
    .theme-dot { 
      width: 22px; 
      height: 22px; 
      border-radius: 50%; 
      cursor: pointer; 
      border: 2px solid rgba(0,0,0,0.15); 
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1); 
    }
    .theme-dot:hover { transform: scale(1.18); }
    
    .btn { 
      padding: 12px 18px; 
      border: none; 
      border-radius: 14px; 
      cursor: pointer; 
      font-size: 14px; 
      font-weight: 600;
      transition: all 0.2s ease; 
    }
    .btn:active { transform: scale(0.96); }

    .input-box { 
      width: 100%; 
      padding: 14px; 
      border-radius: 14px; 
      margin-bottom: 12px; 
      font-size: 14px; 
      outline: none; 
      transition: border-color 0.2s;
    }
    textarea.input-box { 
      height: 180px; 
      resize: none; 
      line-height: 1.7; 
    }

    /* 유튜브 임베드 박스 */
    .bgm-player {
      width: 100%;
      height: 80px;
      border-radius: 14px;
      overflow: hidden;
      margin-bottom: 16px;
      border: none;
    }

    .diary-card {
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      cursor: pointer;
      text-align: left;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .diary-card:hover { 
      transform: translateY(-2px); 
    }
  </style>
</head>
<body>

  <!-- 🔒 1인 전용 로그인 화면 -->
  <div id="login-section" class="book-container theme-dark" style="text-align:center; justify-content:center;">
    <h2 style="font-size: 24px; margin-bottom: 8px;">🗝️ log-in-days</h2>
    <p style="font-size: 13px; color: #94a3b8; margin-bottom: 28px;">내 날들 속으로 온전히 접속하는 공간</p>
    <button class="btn accent-btn" onclick="loginGoogle()">Google 계정으로 로그인</button>
  </div>

  <!-- 📖 log-in-days 메인 뷰 -->
  <div id="diary-app" class="book-container theme-royalty" style="display:none;">
    
    <!-- 상단 바 -->
    <div class="top-bar">
      <div class="app-brand">log-in-days</div>
      <div class="theme-selector">
        <div class="theme-dot" style="background:#fbf8f1; border-color:#d4af37;" title="로판 영애" onclick="setTheme('theme-royalty')"></div>
        <div class="theme-dot" style="background:#181926; border-color:#f38ba8;" title="레트로 게임" onclick="setTheme('theme-retro')"></div>
        <div class="theme-dot" style="background:#0d0f12; border-color:#30363d;" title="올블랙" onclick="setTheme('theme-dark')"></div>
        <div class="theme-dot" style="background:#ffffff; border-color:#cbd5e1;" title="순백 페이퍼" onclick="setTheme('theme-white')"></div>
      </div>
      <div>
        <button class="btn" style="padding:6px 10px; font-size:11px; opacity:0.75; background:none; color:inherit; border:1px solid currentColor;" onclick="logout()">잠그기</button>
      </div>
    </div>

    <!-- 탭 전환 버튼 -->
    <div style="display: flex; gap: 8px; margin-bottom: 16px;">
      <button class="btn accent-btn" style="flex:1;" onclick="switchTab('write')">✍️ 새 일기 쓰기</button>
      <button class="btn accent-btn" style="flex:1;" onclick="switchTab('list')">📚 지난 기록들</button>
    </div>

    <!-- 1. 작성 영역 -->
    <div id="view-write">
      <input type="text" id="title" class="input-box" placeholder="오늘의 소제목">
      <input type="text" id="yt-url" class="input-box" placeholder="🎵 오늘의 노래 (유튜브 링크 복사 후 붙여넣기)">
      <textarea id="content" class="input-box" placeholder="오늘 하루의 공기와 감정, 생각들을 편안하게 남겨보세요..."></textarea>
      <button class="btn accent-btn" style="width:100%; padding:15px; font-size:15px;" onclick="saveDiary()">기록 봉인하기 🖋️</button>
    </div>

    <!-- 2. 목록 영역 -->
    <div id="view-list" style="display:none; flex-grow:1; overflow-y:auto; max-height:60vh; padding-right:4px;">
      <div id="diary-items"></div>
    </div>

    <!-- 3. 상세 보기 팝업 모달 -->
    <div id="detail-modal" style="display:none; margin-top:10px;">
      <button class="btn" style="margin-bottom:12px; font-size:12px; padding:6px 12px; background:rgba(0,0,0,0.06); color:inherit;" onclick="closeDetail()">⬅️ 목록으로</button>
      <h3 id="det-title" style="margin-bottom:6px; font-size:18px;"></h3>
      <div id="det-date" style="font-size:12px; opacity:0.6; margin-bottom:14px;"></div>
      <div id="det-bgm"></div>
      <div id="det-content" style="white-space: pre-wrap; line-height: 1.8; font-size:14px; margin-bottom:24px;"></div>
      <button class="btn" style="background:#ff5252; color:white; font-size:12px; padding:8px 14px;" onclick="deleteCurrentDiary()">기록 삭제</button>
    </div>

  </div>

  <script>
    let currentUser = null;
    let diaries = {};
    let currentDetailId = null;
    let currentSelectedTheme = 'theme-royalty';

    // 유튜브 URL에서 고유 11자리 영상 ID 추출
    function extractYoutubeId(url) {
      if (!url) return null;
      const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
      const match = url.match(regExp);
      return (match && match[2].length === 11) ? match[2] : null;
    }

    // 테마 전환
    function setTheme(themeName) {
      currentSelectedTheme = themeName;
      const app = document.getElementById('diary-app');
      app.className = `book-container ${themeName}`;
    }

    // 탭 스위치
    function switchTab(tab) {
      document.getElementById('view-write').style.display = tab === 'write' ? 'block' : 'none';
      document.getElementById('view-list').style.display = tab === 'list' ? 'block' : 'none';
      document.getElementById('detail-modal').style.display = 'none';
    }

    // Firebase 로드 완료 시 인증 감지
    window.addEventListener('firebase-ready', () => {
      window.fAuth.onAuthStateChanged((user) => {
        if (user && user.email === window.ALLOWED_EMAIL) {
          currentUser = user;
          document.getElementById('login-section').style.display = 'none';
          document.getElementById('diary-app').style.display = 'flex';
          loadDiaries();
        } else if (user) {
          alert("접근 권한이 없는 계정입니다. 허용된 계정으로 로그인해 주세요.");
          window.fSignOut(window.fAuth);
        } else {
          document.getElementById('login-section').style.display = 'flex';
          document.getElementById('diary-app').style.display = 'none';
        }
      });
    });

    function loginGoogle() {
      window.fSignIn(window.fAuth, window.fProvider).catch(err => alert("로그인 오류: " + err.message));
    }

    function logout() {
      window.fSignOut(window.fAuth);
    }

    // 일기 저장
    function saveDiary() {
      const title = document.getElementById('title').value.trim();
      const ytUrl = document.getElementById('yt-url').value.trim();
      const content = document.getElementById('content').value.trim();

      if (!title || !content) {
        alert("제목과 본문을 입력해 주세요!");
        return;
      }

      const now = new Date();
      const dateStr = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')} ${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;

      const diaryData = {
        title,
        ytId: extractYoutubeId(ytUrl),
        content,
        theme: currentSelectedTheme,
        date: dateStr,
        timestamp: Date.now()
      };

      const userDiaryRef = window.fRef(window.fDb, `users/${currentUser.uid}/diaries`);
      const newRef = window.fPush(userDiaryRef);
      window.fSet(newRef, diaryData).then(() => {
        alert("오늘의 감정과 노래가 안전하게 봉인되었습니다. ✨");
        document.getElementById('title').value = '';
        document.getElementById('yt-url').value = '';
        document.getElementById('content').value = '';
        switchTab('list');
      });
    }

    // 일기 목록 실시간 로드
    function loadDiaries() {
      const userDiaryRef = window.fRef(window.fDb, `users/${currentUser.uid}/diaries`);
      window.fOnValue(userDiaryRef, (snapshot) => {
        diaries = snapshot.val() || {};
        renderDiaryList();
      });
    }

    function renderDiaryList() {
      const container = document.getElementById('diary-items');
      container.innerHTML = '';
      const keys = Object.keys(diaries).reverse();

      if (keys.length === 0) {
        container.innerHTML = '<div style="opacity:0.5; padding:30px 10px; text-align:center; font-size:13px;">아직 기록된 날들이 없습니다. 첫 일기를 남겨보세요.</div>';
        return;
      }

      keys.forEach(k => {
        const item = diaries[k];
        const card = document.createElement('div');
        card.className = 'diary-card';
        card.innerHTML = `
          <div style="font-size:11px; opacity:0.6; margin-bottom:2px;">🕒 ${item.date}</div>
          <div style="font-size:15px; font-weight:bold; margin-bottom:4px;">${item.title}</div>
          <div style="font-size:12px; opacity:0.75;">${item.ytId ? '🎵 오늘의 BGM 수록' : '📝 글만 기록됨'}</div>
        `;
        card.onclick = () => openDetail(k);
        container.appendChild(card);
      });
    }

    // 상세 조회
    function openDetail(id) {
      currentDetailId = id;
      const d = diaries[id];
      if (d.theme) setTheme(d.theme);

      document.getElementById('det-title').innerText = d.title;
      document.getElementById('det-date').innerText = d.date;
      document.getElementById('det-content').innerText = d.content;

      const bgmBox = document.getElementById('det-bgm');
      if (d.ytId) {
        bgmBox.innerHTML = `
          <iframe class="bgm-player" 
            src="https://www.youtube.com/embed/${d.ytId}" 
            allow="autoplay; encrypted-media" allowfullscreen>
          </iframe>
        `;
      } else {
        bgmBox.innerHTML = '';
      }

      document.getElementById('view-list').style.display = 'none';
      document.getElementById('view-write').style.display = 'none';
      document.getElementById('detail-modal').style.display = 'block';
    }

    function closeDetail() {
      switchTab('list');
    }

    // 일기 삭제
    function deleteCurrentDiary() {
      if (confirm("이 날의 기록을 정말 영구 삭제하시겠습니까?")) {
        const targetRef = window.fRef(window.fDb, `users/${currentUser.uid}/diaries/${currentDetailId}`);
        window.fRemove(targetRef).then(() => {
          closeDetail();
        });
      }
    }
  </script>
</body>
</html>
